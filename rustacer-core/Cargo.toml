[package]
name = "rustacer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "System logic for Rustacer (no GUI)"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
tracing = "0.1"
sysinfo = "0.39"
wmi = "0.18"
winreg = "0.56"
dirs = "6"
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_System_UpdateAgent",
  "Win32_System_Shutdown",
  "Win32_System_Restore",
  "Win32_System_LibraryLoader","Win32_System_TaskScheduler","Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_System_EventLog",
  "Win32_Graphics_Gdi",
]

[dev-dependencies]
tempfile = "3"

